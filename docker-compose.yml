version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: petflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: petflow_user
      POSTGRES_PASSWORD: petflow_secret
      POSTGRES_DB: petflow
    ports:
      - "5432:5432"
    volumes:
      - petflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petflow_user -d petflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  petflow_pgdata:
    driver: local
